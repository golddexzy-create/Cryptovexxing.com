<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cryptovexxing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #12151a;
      --panel-2: #181c23;
      --border: #252a33;
      --text: #e8eaed;
      --muted: #8b939e;
      --green: #3dd68c;
      --red: #f07178;
      --accent: #5b8def;
      --amber: #e6b450;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

    /* Top bar */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.2);
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--amber);
      border: 1px solid rgba(230, 180, 80, 0.35);
      background: rgba(230, 180, 80, 0.08);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .clock {
      color: var(--muted);
      font-size: 12px;
    }

    /* Layout */
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 16px 100px;
    }
    .grid {
      display: grid;
      gap: 12px;
    }
    @media (min-width: 800px) {
      .grid-main {
        grid-template-columns: 1.4fr 1fr;
        align-items: start;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
    }
    .card-h h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .card-b { padding: 14px; }

    /* Tickers */
    .tickers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 560px) {
      .tickers { grid-template-columns: repeat(5, 1fr); }
    }
    .coin {
      text-align: left;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: inherit;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .coin:hover { border-color: #3a4250; }
    .coin.on {
      border-color: var(--accent);
      background: rgba(91, 141, 239, 0.08);
    }
    .coin .sym {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .coin .px {
      font-family: "IBM Plex Mono", monospace;
      font-size: 15px;
      font-weight: 500;
    }
    .coin .ch {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      margin-top: 2px;
    }
    .up { color: var(--green); }
    .dn { color: var(--red); }

    /* Chart */
    canvas {
      width: 100%;
      height: 220px;
      display: block;
      background: #0a0c0f;
      border-radius: 8px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    /* Advisor log */
    .log {
      height: 220px;
      overflow-y: auto;
      background: #0a0c0f;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      color: #c5cbd3;
    }
    .log .t { color: var(--muted); }
    .log .cmd { color: var(--accent); }

    /* Wallet */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { border-color: #3a4250; }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { filter: brightness(1.05); }
    .btn.block { width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td {
      text-align: left;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    td.mono { font-family: "IBM Plex Mono", monospace; }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    /* Command bar */
    .cmdbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      z-index: 30;
    }
    .cmdbox {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.35);
    }
    .cmdbox input {
      flex: 1;
      height: 40px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      padding: 0 10px;
      outline: none;
    }
    .cmdbox input::placeholder { color: #5c6570; }

    .status-line {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      Cryptovexxing
      <span class="badge">DEMO DESK</span>
    </div>
    <div class="clock mono" id="clock">--:--:--</div>
  </header>

  <main class="shell">
    <section class="card" style="margin-bottom:12px">
      <div class="card-h">
        <h2>Market</h2>
        <span class="status-line" id="feed-status" style="margin:0">Connecting…</span>
      </div>
      <div class="card-b">
        <div class="tickers" id="tickers"></div>
      </div>
    </section>

    <div class="grid grid-main">
      <section class="card">
        <div class="card-h">
          <h2 id="chart-title">BTC · 7D</h2>
          <span class="status-line" id="chart-status" style="margin:0">—</span>
        </div>
        <div class="card-b">
          <canvas id="chart" width="900" height="320"></canvas>
          <div class="meta">
            <span>Source: CoinGecko</span>
            <span class="mono" id="last-print">—</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-h"><h2>Desk log</h2></div>
        <div class="card-b">
          <div class="log" id="ai-log"></div>
          <p class="note">Read-only desk. Commands quote prices and open charts. No orders are sent.</p>
        </div>
      </section>
    </div>

    <section class="card" style="margin-top:12px">
      <div class="card-h"><h2>Wallet</h2></div>
      <div class="card-b">
        <button class="btn primary block" id="connect" type="button">Connect Phantom / MetaMask</button>
        <p class="note" id="wallet-info">Optional. Read-only balances from public RPC. This desk never asks you to sign a transfer.</p>
        <table id="balances"></table>
      </div>
    </section>
  </main>

  <div class="cmdbar">
    <div class="cmdbox">
      <input id="cmd" class="mono" placeholder="price BTC · chart SOL · analyze ETH" autocomplete="off" />
      <button class="btn primary" id="exec" type="button">Run</button>
    </div>
  </div>

  <script>
    const coins = [
      { id: "bitcoin", sym: "BTC" },
      { id: "solana", sym: "SOL" },
      { id: "ethereum", sym: "ETH" },
      { id: "ripple", sym: "XRP" },
      { id: "dogecoin", sym: "DOGE" }
    ];
    let priceData = {};
    let selected = "bitcoin";

    function money(n) {
      if (typeof n !== "number") return "—";
      return n.toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: n < 1 ? 4 : 2
      });
    }
    function findCoin(text) {
      const q = text.toUpperCase();
      return coins.find(c => q.includes(c.sym) || q.includes(c.id.toUpperCase())) || null;
    }
    function log(msg, kind) {
      const el = document.getElementById("ai-log");
      const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const cls = kind === "cmd" ? "cmd" : "";
      el.innerHTML += `<div><span class="t">${t}</span> <span class="${cls}">${msg}</span></div>`;
      el.scrollTop = el.scrollHeight;
    }
    function renderTickers() {
      const box = document.getElementById("tickers");
      box.innerHTML = coins.map(c => {
        const row = priceData[c.id] || {};
        const change = row.usd_24h_change || 0;
        const cls = change >= 0 ? "up" : "dn";
        return `<button class="coin${c.id === selected ? " on" : ""}" data-id="${c.id}" type="button">
          <div class="sym">${c.sym}</div>
          <div class="px">${money(row.usd)}</div>
          <div class="ch ${cls}">${change >= 0 ? "+" : ""}${Number(change).toFixed(2)}%</div>
        </button>`;
      }).join("");
      box.querySelectorAll(".coin").forEach(btn =>
        btn.addEventListener("click", () => openCoin(btn.dataset.id))
      );
    }
    async function fetchPrices() {
      try {
        const ids = coins.map(c => c.id).join(",");
        const res = await fetch(
          `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`
        );
        if (!res.ok) throw new Error("CoinGecko " + res.status);
        priceData = await res.json();
        renderTickers();
        document.getElementById("feed-status").textContent = "Live · 45s refresh";
      } catch (err) {
        document.getElementById("feed-status").textContent = "Paused · " + err.message;
      }
    }
    function quote(coin) {
      const row = priceData[coin.id] || {};
      if (typeof row.usd !== "number") return coin.sym + ": waiting on feed.";
      const change = row.usd_24h_change || 0;
      const side = change >= 0 ? "up" : "down";
      return `${coin.sym} ${money(row.usd)} · ${side} ${Math.abs(change).toFixed(2)}% (24h). Desk is read-only.`;
    }
    async function openCoin(id) {
      selected = id;
      renderTickers();
      const coin = coins.find(c => c.id === id);
      document.getElementById("chart-title").textContent = coin.sym + " · 7D";
      document.getElementById("chart-status").textContent = "Loading…";
      try {
        const res = await fetch(
          `https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=7`
        );
        if (!res.ok) throw new Error("Chart " + res.status);
        const data = await res.json();
        draw(data.prices || []);
        const last = data.prices?.[data.prices.length - 1]?.[1];
        document.getElementById("chart-status").textContent = "Updated";
        document.getElementById("last-print").textContent = "Last " + money(last);
      } catch (err) {
        document.getElementById("chart-status").textContent = err.message;
      }
    }
    function draw(points) {
      const canvas = document.getElementById("chart");
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#0a0c0f";
      ctx.fillRect(0, 0, w, h);
      if (points.length < 2) return;
      const ys = points.map(p => p[1]);
      const min = Math.min(...ys), max = Math.max(...ys);
      const span = max - min || 1;
      const up = ys[ys.length - 1] >= ys[0];
      // fill
      ctx.beginPath();
      points.forEach((p, i) => {
        const x = (i / (points.length - 1)) * (w - 24) + 12;
        const y = h - 20 - ((p[1] - min) / span) * (h - 40);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.lineTo((w - 12), h - 12);
      ctx.lineTo(12, h - 12);
      ctx.closePath();
      ctx.fillStyle = up ? "rgba(61,214,140,0.12)" : "rgba(240,113,120,0.12)";
      ctx.fill();
      // line
      ctx.beginPath();
      points.forEach((p, i) => {
        const x = (i / (points.length - 1)) * (w - 24) + 12;
        const y = h - 20 - ((p[1] - min) / span) * (h - 40);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = up ? "#3dd68c" : "#f07178";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    async function connectWallet() {
      const info = document.getElementById("wallet-info");
      const rows = [];
      try {
        if (window.solana?.connect) {
          const sol = await window.solana.connect();
          const key = sol.publicKey.toString();
          const bal = await rpc("https://api.mainnet-beta.solana.com", "getBalance", [key]);
          const solAmt = (bal.result?.value || 0) / 1e9;
          rows.push(["SOL", solAmt.toFixed(4), key.slice(0, 4) + "…" + key.slice(-4)]);
        }
        if (window.ethereum?.request) {
          const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
          const addr = accounts[0];
          const bal = await rpc("https://cloudflare-eth.com", "eth_getBalance", [addr, "latest"]);
          const eth = Number(BigInt(bal.result || "0x0")) / 1e18;
          rows.push(["ETH", eth.toFixed(4), addr.slice(0, 6) + "…" + addr.slice(-4)]);
        }
        if (!rows.length) {
          info.textContent = "No Phantom or MetaMask detected in this browser.";
          return;
        }
        info.textContent = "Connected · read-only balances from public RPC.";
        document.getElementById("balances").innerHTML =
          "<tr><th>Asset</th><th>Balance</th><th>Address</th></tr>" +
          rows.map(r => `<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td></tr>`).join("");
        log("Wallet · " + rows.map(r => r[0] + " " + r[1]).join(", "));
      } catch (err) {
        info.textContent = "Wallet refused: " + (err.message || "cancelled");
      }
    }
    async function rpc(url, method, params) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
      });
      if (!res.ok) throw new Error(method + " " + res.status);
      return res.json();
    }
    function run(raw) {
      const cmd = raw.trim();
      if (!cmd) return;
      log("> " + cmd, "cmd");
      const lower = cmd.toLowerCase();
      const coin = findCoin(cmd) || coins.find(c => c.id === selected);
      if (/(buy|sell|swap|send|withdraw)/.test(lower)) {
        log("No execution from this desk. Use your own wallet/exchange.");
        return;
      }
      if (lower.startsWith("chart") || lower.includes("analyze")) {
        openCoin(coin.id);
        log(quote(coin));
        return;
      }
      log(quote(coin));
      if (lower.includes("chart")) openCoin(coin.id);
    }

    document.getElementById("connect").addEventListener("click", connectWallet);
    document.getElementById("exec").addEventListener("click", () => {
      const input = document.getElementById("cmd");
      run(input.value);
      input.value = "";
    });
    document.getElementById("cmd").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        run(e.target.value);
        e.target.value = "";
      }
    });
    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }, 1000);

    log("Desk online · prices live · trades not sent");
    fetchPrices();
    setInterval(fetchPrices, 45000);
    openCoin("bitcoin");
  </script>
</body>
</html>
